appId: ${env.NEXT_PUBLIC_APP_ID}
productName: ${env.NEXT_PUBLIC_APP_NAME}
copyright: Copyright © 2026 ${env.NEXT_PUBLIC_APP_NAME}

protocols:
  - name: ${env.NEXT_PUBLIC_APP_NAME} OAuth
    schemes:
      - ${env.NEXT_PUBLIC_APP_PROTOCOL}

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - build/electron/**/*
  - package.json
  - "!**/node_modules/@img/**"
  - "!**/node_modules/sharp/**"

extraMetadata:
  main: build/electron/main.js

asar: true

mac:
  category: public.app-category.travel
  target:
    - target: dmg
      arch: arm64

win:
  signAndEditExecutable: false
  target:
    - nsis
    - portable

linux:
  target:
    - AppImage
    - deb
  maintainer: gabriel lin <2823283465@qq.com>
