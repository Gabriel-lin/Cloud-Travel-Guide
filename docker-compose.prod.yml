# Production overlay (merge with docker-compose.yml).
#   python scripts/stack.py up --prod -d
#
# SANDBOX_RUNTIME=runc by default; set runsc only on Linux hosts with gVisor.

services:
  postgres:
    restart: unless-stopped
    ports: []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cloud_travel_guide}
    # Plain Compose (non-Swarm) honors mem_limit/cpus; deploy.resources is Swarm-oriented.
    mem_limit: 1g
    cpus: 1.0

  docker-proxy:
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25

  migrate:
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}

  backend:
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      LLM_ALLOW_MOCK: "false"
    mem_limit: 2g
    cpus: 2.0

  sandbox-worker:
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    mem_limit: 1g
    cpus: 1.0
