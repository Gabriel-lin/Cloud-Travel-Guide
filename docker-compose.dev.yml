# Local development overlay (merge with docker-compose.yml).
# Hot reload via Compose Watch — python scripts/stack.py up --watch

services:
  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-cloud_travel_guide}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-cloud_travel_guide}
      OAUTH_BACKEND_CALLBACK_BASE: ${OAUTH_BACKEND_CALLBACK_BASE:-http://127.0.0.1:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      OAUTH_REDIRECT_ORIGINS: ${OAUTH_REDIRECT_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      AUTH_COOKIE_SECURE: "false"
      LLM_ALLOW_MOCK: ${LLM_ALLOW_MOCK:-true}
      ENVIRONMENT: development
    volumes:
      - ./backend:/app/backend
      - agent_workspace:/app/backend/.agent_workspace
    develop:
      watch:
        - action: sync+restart
          path: ./backend/app
          target: /app/backend/app
          ignore:
            - "**/__pycache__/**"
            - "**/*.pyc"
            - "**/.mypy_cache/**"
            - "**/.ruff_cache/**"
            - "**/.pytest_cache/**"
        - action: sync+restart
          path: ./backend/main.py
          target: /app/backend/main.py
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock

  sandbox-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-cloud_travel_guide}
      ENVIRONMENT: development
    volumes:
      - ./backend:/app/backend
      - agent_workspace:/app/backend/.agent_workspace
    develop:
      watch:
        - action: sync+restart
          path: ./backend/sandbox_worker
          target: /app/backend/sandbox_worker
        - action: sync+restart
          path: ./backend/app
          target: /app/backend/app
          ignore:
            - "**/__pycache__/**"
            - "**/*.pyc"
