# Sandbox runtime dependencies — built into agent container images via `uv sync`.
# Not part of the main API package; lockfile lives in this directory.
[project]
name = "ctg-sandbox"
version = "0.1.0"
description = "Pre-installed packages for Cloud Travel Guide agent sandboxes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2.3,<3",
    "pandas>=2.2.3,<3",
    "matplotlib>=3.10.0,<4",
    "pillow>=11.1.0,<13",
    "scipy>=1.15.2,<2",
    "openpyxl>=3.1.5,<4",
    "markdown>=3.7,<4",
    "weasyprint>=63.0,<64",
    "python-docx>=1.1.2,<2",
    "fpdf2>=2.8.2,<3",
    "beautifulsoup4>=4.13.3,<5",
    "requests>=2.32.3,<3",
    "pytz>=2025.2",
]

[dependency-groups]
playwright = [
    "playwright>=1.49.0,<2",
]

[tool.uv]
package = false
